  <div id="app"><p class="loading">Loading inbox…</p></div>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <script src="../inbox.js?v=11"></script>
  <script>
  /* Standalone inbox view — same Supabase session as the admin.
     Not signed in? Bounce to the admin login; it sends you back here
     via ?next=inbox after sign-in. */
  (function () {
    "use strict";
    var app = document.getElementById("app");
    var U = window.OasisInbox.util;
    var cfg = window.OASIS_CONFIG || {};
    var READY = !!(
      cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY &&
      cfg.SUPABASE_URL.indexOf("YOUR-PROJECT") === -1 &&
      cfg.SUPABASE_ANON_KEY.indexOf("YOUR-ANON-KEY") === -1
    );
    if (!READY) {
      app.innerHTML =
        '<div class="notice"><h2>Inbox not configured yet</h2>' +
        "<p>The site owner still needs to connect the admin panel to Supabase. " +
        "Once <code>js/config.js</code> has the real project URL and anon key, " +
        "reload this page to sign in.</p></div>";
      return;
    }
    var sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

    function shell(session) {
      app.innerHTML =
        '<header class="appbar"><div class="appbar-inner">' +
        '<div class="brand"><img src="../../images/logo.png" alt="" class="brand-logo" />' +
        '<div class="brand-text"><strong>Oasis Admin</strong><span>Inbox</span></div></div>' +
        '<div class="userbox"><span class="user-email">' + U.esc(session.user.email) + "</span>" +
        '<button type="button" class="icon-btn" id="logout">' + U.icon("i-logout") + "<span>Log out</span></button></div>" +
        "</div></header>" +
        "</div>" +
        '<main class="panels"><section id="inbox-page" aria-label="Inbox"></section></main>';
      document.getElementById("logout").addEventListener("click", function () {
        sb.auth.signOut().then(function () { window.location.replace("../"); });
      });
      window.OasisInbox.init({ sb: sb, el: document.getElementById("inbox-page") });
    }

    var started = false;
    function start(s) {
      if (started) return;
      started = true;
      shell(s);
    }
    sb.auth.getSession().then(function (res) {
      var s = res.data.session;
      if (s) start(s);
      else window.location.replace("../?next=inbox");
    });
    sb.auth.onAuthStateChange(function (_event, s) {
      if (s) start(s);
      else if (started) window.location.replace("../?next=inbox");
    });
  })();
  </script>
